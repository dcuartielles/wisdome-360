<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chorus — p5.js dome sketch</title>
<style>
  html,body{margin:0;height:100%;background:#06090f;color:#f2f5fa;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  main{position:fixed;inset:0;display:grid;place-items:center}
  canvas{display:block;max-width:100vmin;max-height:100vmin}
  #hint{position:fixed;left:14px;bottom:14px;font-size:12px;color:#8fa3be;
    background:#101725;border:1px solid #24314a;border-radius:8px;padding:10px 12px;
    line-height:1.6;max-width:min(420px,92vw)}
  b{color:#ff7e4d}
</style>
</head>
<body>
<main></main>
<div id="hint">
  <b>CHORUS</b> — p5.js, drawn in the audience's angles.<br>
  <b>S</b> save dome master &nbsp;·&nbsp; <b>G</b> comfortable zone &nbsp;·&nbsp;
  <b>R</b> reseed &nbsp;·&nbsp; <b>click</b> add a voice at that angle
</div>
<script src="vendor/p5.min.js"></script>
<script>
/* =======================================================================
   EX-04  "CHORUS"  --  a dome master drawn with p5.js
   =======================================================================
   The whole example is one habit:

       DO NOT draw at (x, y). Draw at (azimuth, elevation) AS THE AUDIENCE
       SEES IT, and let roomXY() work out where that lands on the canvas.

       azimuth   0 = the front of the room, + turns to the right
       elevation 0 = eye level, 90 = straight up

   Once you have roomXY(), every p5 sketch you already know how to write
   becomes a dome sketch. Lines of constant elevation become arcs, correctly.

   Where things go:
       comfortable zone = IN FRONT, 15-60 degrees above eye level,
                          +-60 degrees either side of the front
       sweet spot       = straight ahead, 40 degrees up
       everything else  = ambience. Nobody turns round for it.
   Press G to see them drawn over the sketch.

   What roomXY() does, so you can check it yourself. A dome master is an
   equidistant fisheye of the DOME's hemisphere:
       centre of the canvas = the dome's zenith
       edge of the canvas   = the dome's rim
       radius is LINEAR in angle from the dome's zenith (50% out = 45 deg)
       the front of the room is at the BOTTOM
   Wisdome Malmo is TILTED 26 degrees, raised at the back, so the dome's
   zenith is not overhead: it is 64 degrees up, in front of the audience.
   roomXY() tilts the audience's angles into the dome's (roomToDome), then
   places them on the canvas (domeXY).
   ======================================================================= */

const RES   = 1024;        // 2048 when you export for delivery
const TILT  = 26;          // dome tilt in degrees (Wisdome Malmo), back raised
const ZONE  = { lo: 15, hi: 60, az: 60 };   // comfortable zone (audience degrees)
const SWEET = { el: 40, r: 12 };            // sweet spot, straight ahead
const LEADS = 6;           // voices that sing in the comfortable zone
const AMBIENT = 4;         // voices that drift all the way round, quietly

let voices = [];
let showGuide = false;

/* ---- the audience's angles -> the canvas ------------------------------ */
function roomXY(azDeg, elDeg) {
  const d = roomToDome(azDeg, elDeg);
  return d ? domeXY(d[0], d[1]) : null;        // null = off the dome (below its rim)
}

/* the dome's own angles -> the canvas (centre = dome zenith, front at the bottom) */
function domeXY(azDeg, elevDeg) {
  const c = RES / 2;
  const r = (1 - constrain(elevDeg, 0, 90) / 90) * c;   // linear in angle
  const a = radians(azDeg);
  return [c + r * sin(a), c + r * cos(a)];              // az 0 -> bottom
}

/* audience angles -> dome angles. Room: x = right, y = front, z = up.
   Returns [domeAz, domeElev], or null below the dome's rim. */
function roomToDome(azDeg, elDeg) {
  const a = radians(azDeg), e = radians(elDeg), t = radians(TILT);
  const x = cos(e) * sin(a), y = cos(e) * cos(a), z = sin(e);
  const ly = y * cos(t) - z * sin(t), lz = y * sin(t) + z * cos(t);
  const de = degrees(Math.asin(constrain(lz, -1, 1)));
  if (de < 0) return null;
  return [degrees(Math.atan2(x, ly)), de];
}

/* the other way: a canvas point -> the audience's [azimuth, elevation] */
function canvasToRoom(px, py) {
  const c = RES / 2, dx = (px - c) / c, dy = (py - c) / c;
  const r = Math.hypot(dx, dy);
  if (r > 1) return null;
  const th = r * HALF_PI, a = Math.atan2(dx, dy), t = radians(TILT);
  const lx = sin(th) * sin(a), ly = sin(th) * cos(a), lz = cos(th);
  const x = lx, y = ly * cos(t) + lz * sin(t), z = -ly * sin(t) + lz * cos(t);
  return [degrees(Math.atan2(x, y)), degrees(Math.asin(constrain(z, -1, 1)))];
}

/* draw a path given in AUDIENCE angles, broken wherever it leaves the dome */
function roomPath(points) {
  let open = false;
  for (const [az, el] of points) {
    const p = roomXY(az, el);
    if (!p) { if (open) { endShape(); open = false; } continue; }
    if (!open) { beginShape(); open = true; }
    vertex(p[0], p[1]);
  }
  if (open) endShape();
}

/* A stroke of constant elevation is an ARC on the dome, never a straight
   line. Walk it in azimuth and let roomXY bend it for you. */
function roomArc(az0, az1, elevFn, steps = 200) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t  = i / steps;
    const az = lerp(az0, az1, t);
    pts.push([az, elevFn(az, t)]);
  }
  roomPath(pts);
}

/* A LEAD voice is the subject: born in the comfortable zone, and it stays
   there. An AMBIENT voice wraps the room, higher and quieter. */
function newVoice(lead, az, el) {
  return {
    lead,
    az:     az ?? (lead ? random(-40, 40) : random(-180, 180)),
    elev:   el ?? (lead ? random(26, 54) : random(30, 70)),
    span:   lead ? random(40, 100) : random(120, 220),   // degrees of azimuth it reaches
    lobes:  floor(random(2, 6)),
    amp:    lead ? random(2.5, 6) : random(2, 4),
    speed:  lead ? random(-0.06, 0.06) : random(-0.18, 0.18),   // degrees per frame
    weight: lead ? random(3, 8) : random(1.5, 3.5),
    bright: lead ? 100 : 55,
    hue:    lead ? random(8, 38) : random(198, 226),     // warm in front, cool around
    sat:    random(60, 95),
    phase:  random(TAU),
  };
}

function seed() {
  voices = [];
  for (let i = 0; i < AMBIENT; i++) voices.push(newVoice(false));
  for (let i = 0; i < LEADS; i++) voices.push(newVoice(true));
}

function setup() {
  const c = createCanvas(RES, RES);
  c.parent(document.querySelector('main'));
  colorMode(HSB, 360, 100, 100, 1);
  noFill();
  seed();
}

function draw() {
  background(230, 40, 3);                     // near-black: keep the dome dark

  // faint rim wash -- depth at almost no cost in average picture level
  push(); noStroke();
  for (let i = 0; i < 22; i++) {
    const e = i * 0.8;
    fill(275, 50, 16, 0.045);
    circle(RES / 2, RES / 2, 2 * (RES / 2) * (1 - e / 90));
  }
  pop();

  const t = frameCount * 0.01;

  for (const v of voices) {
    v.az += v.speed;
    // lead voices turn round at the edge of the zone, so the subject stays in front
    if (v.lead && abs(v.az) + v.span / 2 > ZONE.az + 10) v.speed = -abs(v.speed) * Math.sign(v.az);
    if (!v.lead) v.az = ((v.az + 540) % 360) - 180;
    // draw each voice three times, thick-to-thin, for a cheap glow
    for (let pass = 0; pass < 3; pass++) {
      const w = v.weight * (1 + (2 - pass) * 2.2);
      const a = [0.07, 0.20, 0.92][pass];
      stroke(v.hue, v.sat, v.bright, a);
      strokeWeight(w);
      roomArc(v.az - v.span / 2, v.az + v.span / 2,
              function (az, u) {
                // wobble in elevation, and taper the ends so nothing
                // stops abruptly in mid-air
                const taper = sin(u * PI);
                return v.elev
                     + v.amp * sin(radians(az) * v.lobes + t * 3 + v.phase)
                     - (1 - taper) * 7;
              });
    }
  }

  if (showGuide) drawGuide();
}

function drawGuide() {
  push(); noFill();
  const range = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);

  // eye-level rings every 15 degrees -- on a tilted dome they are NOT
  // circles round the centre of the image
  stroke(220, 30, 90, 0.35); strokeWeight(1.5);
  for (let e = 0; e <= 75; e += 15) roomPath(range(-180, 180, 240).map((az) => [az, e]));

  // the comfortable zone: a patch IN FRONT of the audience
  stroke(140, 70, 95, 0.95); strokeWeight(3);
  roomPath([
    ...range(-ZONE.az, ZONE.az, 60).map((az) => [az, ZONE.lo]),
    ...range(ZONE.lo, ZONE.hi, 30).map((el) => [ZONE.az, el]),
    ...range(ZONE.az, -ZONE.az, 60).map((az) => [az, ZONE.hi]),
    ...range(ZONE.hi, ZONE.lo, 30).map((el) => [-ZONE.az, el]),
  ]);

  // the sweet spot: straight ahead, 40 degrees up, 12-degree radius
  stroke(45, 80, 100, 0.95); strokeWeight(3);
  const se = radians(SWEET.el), sr = radians(SWEET.r);
  roomPath(range(0, TAU, 72).map((f) => {
    const x = sin(sr) * cos(f);
    const y = cos(sr) * cos(se) - sin(sr) * sin(f) * sin(se);
    const z = cos(sr) * sin(se) + sin(sr) * sin(f) * cos(se);
    return [degrees(Math.atan2(x, y)), degrees(Math.asin(z))];
  }));
  const c = roomXY(0, SWEET.el);
  noStroke(); fill(45, 80, 100, 0.95); circle(c[0], c[1], 10);

  // the front of the room, at eye level
  stroke(20, 85, 100, 0.9); strokeWeight(5);
  roomPath([[0, -12], [0, 4]]);
  pop();
}

function keyPressed() {
  const k = key.toLowerCase();
  if (k === 's') saveCanvas('chorus_domemaster_' + RES + 'x' + RES, 'png');
  if (k === 'g') showGuide = !showGuide;
  if (k === 'r') seed();
}

function mousePressed() {
  // convert the click back into the audience's angles, so a new voice
  // appears exactly where you pointed. Inside the zone it is a lead voice.
  const p = canvasToRoom(mouseX, mouseY);
  if (!p) return;
  const [az, el] = p;
  const lead = abs(az) <= ZONE.az && el >= ZONE.lo && el <= ZONE.hi;
  voices.push(newVoice(lead, az, el));
  if (voices.length > 20) voices.shift();
}
</script>
</body>
</html>
