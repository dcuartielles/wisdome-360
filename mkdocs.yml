site_name: Wisdome 360
site_description: Making work for the Wisdome Malmö dome with open tools. Includes the 2026 MaU module for EDT 26 and TEI 26.
site_author: David Cuartielles
site_url: https://dcuartielles.github.io/wisdome-360/
repo_url: https://github.com/dcuartielles/wisdome-360
repo_name: dcuartielles/wisdome-360
edit_uri: edit/main/docs/
copyright: >-
  Text and media we made: <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> ·
  Code: <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3.0</a> ·
  Imported material keeps its own licence — see <a href="https://dcuartielles.github.io/wisdome-360/credits/">Credits</a>

theme:
  name: material
  language: en
  font:
    text: Atkinson Hyperlegible
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.action.edit
  logo: assets/logo/wisdome360-mark-white.svg
  favicon: assets/logo/favicon.svg
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]      # .py files stay plain downloads
      execute: false
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - The dome:
      - reference/index.md
      - Where to put things: reference/comfortable-zone.md
      - The venue: reference/venue.md
      - Connecting a live piece: reference/connecting.md
      - Delivery spec: reference/delivery-spec.md
  - Set up:
      - setup/index.md
      - Setup wizard: setup/wizard.html
      - Dome Simulator: tools/dome-simulator.html
  - Make:
      - make/index.md
      - Making a film: make/film.md
      - Making a live piece: make/live.md
  - Examples:
      - examples/index.md
      - EX-01 Drift (Blender): examples/ex01-drift.md
      - EX-02 Tide (Python): examples/ex02-tide.ipynb
      - EX-03 Pulse (WebGL): examples/ex03-pulse.md
      - EX-04 Chorus (p5.js): examples/ex04-chorus.md
      - EX-05 TouchDesigner: examples/ex05-touchdesigner.md
      - EX-06 Unity: examples/ex06-unity.md
      - EX-07 OpenSpace: examples/ex07-openspace.md
      - EX-08 Flat to Dome: examples/ex08-flat-to-dome.ipynb
      - EX-09 Type size: examples/ex09-type-size.ipynb
      - EX-10 Flight: examples/ex10-flight.ipynb
  - Problems: problems.md
  - MaU course 2026:
      - course/index.md
      - The week: course/week.md
      - Hand-in: course/hand-in.md
  - About:
      - What changed: changes.md
      - Credits and licences: credits.md
