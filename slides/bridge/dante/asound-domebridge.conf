# >>> dome-bridge (Inferno virtual Dante device) >>>
# Added by live/bridge/dante/start-dante.sh. ALSA device "dome" = Dante device DOME-BRIDGE,
# 6 transmit channels (L R C LFE Ls Rs), no receive channels. Inferno only accepts S32 samples
# and power-of-two buffers (>= 1024 frames); domebridge_rx.py and the test commands use those.
pcm.dome {
	type inferno
	NAME "DOME-BRIDGE"
	SAMPLE_RATE "@RATE@"
	TX_CHANNELS "6"
	RX_CHANNELS "0"
	BIND_IP "@BIND@"
	hint {
		show on
		description "DOME-BRIDGE (Inferno, Dante)"
	}
}
# <<< dome-bridge <<<
