<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisdome Live · launch</title>
<style>
  :root { --bg: #050608; --fg: #e9ecef; --mut: #6d737c; --acc: #ffb547; --acc2: #6cc6ff; --ok: #5be38b; --bad: #ff5d5d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font: 15px/1.5 "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
  #stage { position: fixed; inset: 0 0 26px 0; display: flex; flex-wrap: nowrap; gap: 3vw; align-items: center; justify-content: center; padding: 3vh 4vw; overflow: hidden; transition: transform 1.4s cubic-bezier(.6,0,.9,.4), filter 1.4s, opacity 1.4s; }
  #stage > section { flex: 0 1 560px; min-width: 300px; max-width: 92vw; }
  #checks li, #checks .k { min-width: 0; }
  #checks .v { flex: 0 0 auto; min-width: 0; }
  #stage.warp { transform: scale(3.2); filter: blur(14px) brightness(2.2); opacity: 0; }
  canvas { width: min(84vh, 46vw); height: min(84vh, 46vw); flex: 0 0 auto; }
  .brand { letter-spacing: .5em; color: var(--acc); font-size: 13px; }
  h1 { font: 800 clamp(34px, 4.4vw, 64px)/1.02 "Inter", "Segoe UI", system-ui, sans-serif; margin: 10px 0 4px; letter-spacing: .02em; }
  .sub { color: var(--mut); letter-spacing: .25em; font-size: 12px; margin-bottom: 4vh; }
  #checks { list-style: none; padding: 0; margin: 0 0 4vh; min-height: 13em; }
  #checks li { display: flex; gap: 12px; white-space: nowrap; opacity: 0; transform: translateX(-10px); transition: all .25s; padding: 3px 0; }
  #checks li.in { opacity: 1; transform: none; }
  #checks .n { color: var(--mut); }
  #checks .k { flex: 1; overflow: hidden; }
  #checks .k::after { content: " ........................................................................"; color: #2a2e35; }
  #checks .v { min-width: 15ch; text-align: right; }
  .ok { color: var(--ok); } .warn { color: var(--acc); } .bad { color: var(--bad); } .wait { color: var(--mut); }
  .wait::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  #ignite { --s: 150px; flex: 0 0 auto; width: var(--s); height: var(--s); border-radius: 50%; border: 2px solid var(--acc); background: radial-gradient(circle at 50% 40%, #3a2a10, #120c05 70%); color: var(--acc); font: 800 20px/1 "Inter", "Segoe UI", system-ui, sans-serif; letter-spacing: .25em; cursor: pointer; position: relative; opacity: 0; transition: opacity .6s, transform .15s; box-shadow: 0 0 0 0 rgba(255,181,71,.5); }
  #ignite.ready { opacity: 1; animation: pulse 2.2s infinite; }
  #ignite:hover { transform: scale(1.04); }
  #ignite:active { transform: scale(.97); }
  #ignite.fired { animation: none; background: var(--acc); color: #120c05; box-shadow: 0 0 80px 20px rgba(255,181,71,.6); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,181,71,.45); } 70% { box-shadow: 0 0 0 38px rgba(255,181,71,0); } 100% { box-shadow: 0 0 0 0 rgba(255,181,71,0); } }
  .row { display: flex; align-items: center; gap: 28px; }
  .hint { color: var(--mut); font-size: 12px; line-height: 1.9; }
  .hint a { color: var(--acc2); text-decoration: none; }
  #count { font: 800 clamp(40px, 6vw, 90px)/1 "Inter", system-ui, sans-serif; color: var(--acc); min-width: 3ch; }
  #ticker { position: fixed; left: 0; right: 0; bottom: 0; height: 26px; overflow: hidden; color: #30353d; font-size: 12px; white-space: nowrap; border-top: 1px solid #111418; }
  #ticker span { display: inline-block; padding-top: 5px; animation: tick 60s linear infinite; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  #white { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .12s; }
  @media (max-aspect-ratio: 1/1) { #stage { flex-direction: column; gap: 2vh; } #stage > section { width: min(560px, 92vw); flex: 0 0 auto; } canvas { width: min(46vh, 80vw); height: min(46vh, 80vw); } #checks { min-height: 0; } }
  @media (max-height: 760px) { h1 { font-size: clamp(28px, 5vh, 48px); } .sub { margin-bottom: 2vh; } #checks { margin-bottom: 2vh; font-size: 13px; } #ignite { --s: 120px; font-size: 17px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scope" width="1400" height="1400"></canvas>
  <section>
    <div class="brand">MALMÖ UNIVERSITY · EDT / TEI</div>
    <h1>WISDOME&nbsp;LIVE</h1>
    <div class="sub">DOME SLIDES · LAUNCH CONSOLE</div>
    <ol id="checks"></ol>
    <div class="row">
      <button id="ignite" title="Enter">IGNITE</button>
      <div><div id="count"></div><div class="hint">Enter / Space: ignite<br>S: skip to the presenter · M: console sound on/off<br><a href="../presenter/">presenter →</a></div></div>
    </div>
  </section>
</div>
<div id="white"></div>
<div id="ticker"><span id="tk"></span></div>
<script type="module" src="./launch.js"></script>
</body>
</html>
