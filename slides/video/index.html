<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dome video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  body.master canvas { width: 100vmin; height: 100vmin; position: absolute; inset: 0; margin: auto; }
  body.inside canvas { width: 100vw; height: 100vh; cursor: grab; }
  #hud { position: fixed; left: 10px; bottom: 8px; font: 12px/1.4 system-ui, sans-serif; color: #8a8f98; pointer-events: none; white-space: pre; }
  #tap { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font: 600 20px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55); cursor: pointer; }
  #frames { position: absolute; inset: 0; margin: auto; width: 100vmin; height: 100vmin; pointer-events: none; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 50%; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="frames"></div>
<div id="hud"></div>
<div id="tap">Click to start sound</div>
<script type="module" src="./video.js"></script>
</body>
</html>
